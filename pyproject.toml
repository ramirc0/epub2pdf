[project]
name = "epub2pdf"
version = "0.1.0"
description = "Convert EPUB books to rose-pine themed PDFs with pandoc and typst"
authors = [
    { name = "Christian Ramirez", email = "chrisram0403@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "typst>=0.15,<0.16",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
